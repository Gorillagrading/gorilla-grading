<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo-green.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gorilla Grading — International Standard for Card Authentication &amp; Optical Grading</title>
    <meta name="description" content="International trading card grading platform. Sub-millimeter optical precision, hermetically sealed slabs and digitally signed certificates." />
    <meta property="og:site_name" content="Gorilla Grading" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Gorilla Grading — International Standard for Card Authentication &amp; Optical Grading" />
    <meta property="og:description" content="International trading card grading platform. Sub-millimeter optical precision, hermetically sealed slabs and digitally signed certificates." />
    <meta property="og:url" content="https://gorilla-grading.vercel.app/" />
    <meta property="og:image" content="https://gorilla-grading.vercel.app/images/hero-slab-promo-poster.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Pone el tema (claro u oscuro) antes de pintar nada, para que no haya un parpadeo de colores al cargar.
      // Misma regla que ThemeContext: la elección manual de la sesión, o la hora (oscuro de 20:00 a 06:59).
      (function () {
        try {
          var manual = sessionStorage.getItem('gorilla_theme_manual_override');
          var hour = new Date().getHours();
          var theme = manual === 'light' || manual === 'dark' ? manual : hour >= 20 || hour < 7 ? 'dark' : 'light';
          document.documentElement.classList.add(theme + '-theme');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#111311] text-[#F5F6F2] font-sans antialiased selection:bg-[#61B663] selection:text-[#111311] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
